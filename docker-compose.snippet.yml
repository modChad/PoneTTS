# Merge ONE of the two service blocks below into your existing
# docker-compose.yml — whichever matches this host's actual GPU. Both are
# shown for reference/future use if you ever move this to a different
# machine; don't enable both at once.
#
# Common to both:
#   - Same `networks:` entry as your SillyTavern service, so ST can reach
#     this container by name (http://pone-ttsmod:8800/v1/audio/speech) instead of
#     the host IP that wasn't reachable from inside the ST container.
#   - release/ (the ~12 GB model) lives in a named volume so it survives
#     rebuilds and isn't baked into the image.
#   - If pone-ttsmod shares a network namespace with something else (e.g. via
#     `network_mode: service:<vpn-container>`) that already owns port 8000
#     (gluetun's control server defaults to 8000, for example), set
#     `environment: - PORT=8800` (or any free port) instead of fighting the
#     other container's config — server.py/entrypoint.sh already honor $PORT.

# ============================================================
# Option A — NVIDIA (this host, per your confirmation)
# ============================================================
services:
  pone-ttsmod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-cuda
    image: pone-ttsmod:cuda
    container_name: pone-ttsmod
    restart: unless-stopped

    # Requires the NVIDIA Container Toolkit (already confirmed working here).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "8800:8800"           # drop this if only other containers need it

    volumes:
      - pone-ttsmod_release:/app/release
      - pone-ttsmod_sfx_cache:/app/sfx_cache        # only ever populated by an outgoing fetch — remove this
                                                # line too if you set MOSS_SFX_ALLOW_NETWORK=0 below
      - ./server/voice_patch:/app/voice_patch  # optional pronunciation-fix LoRA; missing is non-fatal
      - ./server/st_cache:/app/st_cache        # cache for the /st_cache/generate endpoint — visible/durable on the host
      - ./server/history:/app/history          # every generated line, playable from the web page (MOSS_HISTORY_MAX)

    # Every value below is the built-in default (server.py already has it), so
    # you only need to list the ones you change. Edit a value, then run
    # `docker compose up -d` — that recreates the container with the new values,
    # no image rebuild needed. (Full descriptions: README.md > Configuration.)
    environment:
      - MOSS_PERF_PRESET=balanced   # quality | balanced | low_vram | potato
      - MOSS_SFX_ALLOW_NETWORK=1    # 0 = /sfx serves only from its cache, never calls out to Freesound/BBC
      - MOSS_AUDIO_TEMPERATURE=0.85 # sampling temperature: lower = steadier, higher = more expressive
      - MOSS_HISTORY_MAX=500        # generated lines kept in the history; 0 = history off

      # Pauses between clauses (seconds)
      - MOSS_SENTENCE_PAUSE_SEC=0.12  # between sentences
      - MOSS_COMMA_PAUSE_SEC=0.08     # between comma-split pieces of one sentence
      - MOSS_STREAM_BUFFER_SEC=3      # seconds of audio to generate before streaming starts (0 = off)
      - MOSS_PAUSE_SEC=0.35           # at an em-dash / ellipsis

      # Quality checks (stuck words, failed sentences)
      - MOSS_FIX_STUCK_WORDS=1        # Whisper-check each sentence for stuck/droning words; 0 = much faster
      - MOSS_LOOP_GUARD_REL_MULT=1.6  # sentence this many times longer than expected gets a Whisper repeat check
      - MOSS_LOOP_GUARD_MIN_HEARD=0.5 # heard less than this share of the words = failed, regenerate
      - MOSS_FAILED_CLAUSE_RETRIES=2  # regenerations of a failed sentence before sending it as-is
      - MOSS_COMMA_SPLIT_MIN_WORDS=20 # sentences longer than this are also split at commas; 0 = never

      # Pronunciation helpers (both off by default; pronunciations.txt always applies)
      - MOSS_FIX_PRON=0               # verify rare words with Whisper and retry respellings (slower)
      - MOSS_AUTO_RESPELL=0           # respell rare words phonetically before synthesis

      # Not set by default — uncomment to override:
      # - PORT=8800                   # port inside the container (see the network_mode note at the top)
      # - MOSS_DECODER_RUNTIME=onnx_cpu  # onnx_cuda | onnx_cpu | onnx_hybrid; default comes from the preset

    networks:
      - your_shared_network   # <- replace with whatever network your ST service is on

volumes:
  pone-ttsmod_release:
  pone-ttsmod_sfx_cache:

networks:
  your_shared_network:
    external: true            # or remove `external: true` if it's defined in this same file


